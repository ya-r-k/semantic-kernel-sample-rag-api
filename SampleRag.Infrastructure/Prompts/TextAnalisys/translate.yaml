name: translate
description: Translate input text into the requested language; response is plain translated text only.
template: |
  Translate the following text into {{language}}. Preserve meaning, register, and tone. Do not add explanations, notes, or quotation marks around the result.

  Text:
  {{input}}

  Output only the translated text, with no surrounding labels.
template_format: handlebars
input_variables:
  - name: input
    description: The text to translate.
    is_required: true
  - name: language
    description: The target language for the translation.
    is_required: true
execution_settings:
  default:
    temperature: 0.2
    max_tokens: 2048
    model_id: qwen3.5:0.8b
    think: false
